# Ferretería El Tornillo — VirtualHost de Apache
#
# Instalación (sección 3.7 del README.md):
#   sudo cp /var/www/ferreteria/server/apache/ferreteria.conf /etc/apache2/sites-available/
#   sudo a2dissite 000-default.conf
#   sudo a2ensite ferreteria.conf
#   sudo systemctl reload apache2
#
# Comprobar la sintaxis antes de recargar:
#   sudo apache2ctl configtest


<VirtualHost *:80>
    # El sitio se publica por IP en la red del laboratorio, no hay dominio.
    # Al ser el único sitio habilitado, Apache lo usa como VirtualHost por
    # defecto y responde a cualquier nombre o IP.
    ServerName ferreteria.local
    ServerAdmin webmaster@localhost

    DocumentRoot /var/www/ferreteria/public

    <Directory /var/www/ferreteria/public>
        # -Indexes evita que Apache liste el contenido de las carpetas que no
        # tienen index.php. +FollowSymLinks lo necesita mod_rewrite por si más
        # adelante se usan URLs amigables.
        Options -Indexes +FollowSymLinks

        # El proyecto no usa .htaccess: toda la configuración vive en este
        # archivo. Cambiar a "All" si alguna vez se añade uno.
        AllowOverride None

        Require all granted

        DirectoryIndex index.php index.html
    </Directory>

    # Imágenes que suben los vendedores. Los permisos de la carpeta se
    # configuran en la sección 3.8 del README.md.
    <Directory /var/www/ferreteria/public/uploads>
        Options -Indexes
        Require all granted
    </Directory>

    # Logs propios del sitio, separados de los de Apache por defecto.
    ErrorLog  ${APACHE_LOG_DIR}/ferreteria_error.log
    CustomLog ${APACHE_LOG_DIR}/ferreteria_access.log combined

    # "warn" es el nivel por defecto. Subir a "info" o "debug" durante las
    # pruebas de las vulnerabilidades de la sección 5 del README.md.
    LogLevel warn
</VirtualHost>
